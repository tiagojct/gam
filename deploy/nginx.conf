server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx sits behind cloudflared and Caddy and only sees plain HTTP;
    # keep redirects relative so they never say http://.
    absolute_redirect off;

    # Strict CSP: no inline scripts or styles, nothing from other origins.
    # blob: is not needed for downloads (they are navigations, not fetches).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/x-lua text/x-r text/x-python text/yaml application/toml;

    # Content-hashed build output: cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Unhashed but rarely changing: fonts, icons, the Open Graph image, the
    # official files copied from the family repositories.
    location ^~ /fonts/ { expires 30d; add_header Cache-Control "public" always; }
    location ^~ /official/ { expires 1h; add_header Cache-Control "public" always; default_type text/plain; }
    location = /theme.js { add_header Cache-Control "no-cache" always; }
    location = /og.png { expires 1d; }
    location = /favicon.svg { expires 7d; }
    location = /favicon.png { expires 7d; }
    location = /apple-touch-icon.png { expires 7d; }
    location = /favicon.ico { access_log off; log_not_found off; return 404; }

    # HTML is never cached: a new build must show at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404/index.html;
}
