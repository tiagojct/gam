# Gam: static site (nginx) behind Caddy on the proxy network, the same
# shape as /opt/vps/apps/loomings. The image is built and pushed by
# .github/workflows/build-deploy.yml in github.com/tiagojct/gam; :latest
# moves on every successful build of main, on family dispatches and on
# the weekly schedule, so the one watchtower already on the box redeploys
# within five minutes. Do not add a second watchtower service here.
services:
  gam:
    image: ghcr.io/tiagojct/gam:latest
    container_name: gam
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"

networks:
  proxy:
    external: true
